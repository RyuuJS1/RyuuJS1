<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="130">
  <defs>
    <!-- Gradiente Tricolor para el Borde Exterior -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
  </defs>

  <!-- Fondo Azul Marino -->
  <rect x="5" y="5" width="790" height="120" rx="12" fill="#0B1329" />

  <!-- Borde Exterior Principal con Gradiente Tricolor -->
  <rect x="5" y="5" width="790" height="120" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Borde Interior Delgado en Dorado -->
  <rect x="12" y="12" width="776" height="106" rx="8" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" />
</svg>
